<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CollabBoard — shared whiteboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --ink:        #0d1626;
  --ink-2:      #16233a;
  --ink-3:      #1f3050;
  --paper:      #fbfaf7;
  --grid:       #dbe3ee;
  --edge:       rgba(13,22,38,.10);
  --text:       #0d1626;
  --text-dim:   #5b6b83;
  --panel:      rgba(255,255,255,.82);
  --panel-solid:#ffffff;
  --panel-edge: rgba(13,22,38,.10);
  --shadow:     0 1px 2px rgba(13,22,38,.06), 0 12px 32px -12px rgba(13,22,38,.28);
  --shadow-lift:0 2px 4px rgba(13,22,38,.08), 0 24px 48px -16px rgba(13,22,38,.34);
  --signal:     #14b8a6;
  --signal-ink: #0b7c71;
  --warn:       #d97706;
  --danger:     #dc2626;
  --sel:        rgba(20,184,166,.14);
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
  --tray-gap: 14px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink: #060b14; --ink-2:#0f1a2c; --ink-3:#1b2b46;
    --paper: #0a1220; --grid: #16263f; --edge: rgba(255,255,255,.10);
    --text: #e8eef7; --text-dim:#8aa0bd;
    --panel: rgba(16,26,44,.80); --panel-solid:#101a2c; --panel-edge: rgba(255,255,255,.10);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 36px -14px rgba(0,0,0,.7);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.45), 0 28px 56px -18px rgba(0,0,0,.8);
    --signal:#2dd4bf; --signal-ink:#5eead4; --sel: rgba(45,212,191,.16);
  }
}
:root[data-theme="dark"]{
  --ink: #060b14; --ink-2:#0f1a2c; --ink-3:#1b2b46;
  --paper: #0a1220; --grid: #16263f; --edge: rgba(255,255,255,.10);
  --text: #e8eef7; --text-dim:#8aa0bd;
  --panel: rgba(16,26,44,.80); --panel-solid:#101a2c; --panel-edge: rgba(255,255,255,.10);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 36px -14px rgba(0,0,0,.7);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.45), 0 28px 56px -18px rgba(0,0,0,.8);
  --signal:#2dd4bf; --signal-ink:#5eead4; --sel: rgba(45,212,191,.16);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text); background:var(--paper);
  overflow:hidden; overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.45;
}
button,input,select{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--signal); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

/* ============================================================
   Stage
   ============================================================ */
#stage{ position:fixed; inset:0; padding-top:env(safe-area-inset-top,0px); }
#paper{
  position:absolute; inset:0;
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 1px 1px, var(--grid) 1.15px, transparent 0);
  background-size:26px 26px;
  transition:background-image .2s ease;
}
#paper.plain{ background-image:none; }
#paper.ruled{
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#overlay{ pointer-events:none; }
#cursor-layer{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }

/* ============================================================
   Floating chrome
   ============================================================ */
.glass{
  background:var(--panel);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid var(--panel-edge);
  box-shadow:var(--shadow);
  border-radius:var(--r-lg);
}

/* --- top bar --- */
#topbar{
  position:absolute; top:var(--tray-gap); left:var(--tray-gap); right:var(--tray-gap);
  display:flex; align-items:center; gap:10px;
  padding:8px 10px 8px 14px; height:52px; z-index:40;
}
.brand{
  display:flex; align-items:baseline; gap:8px;
  font-family:"Space Grotesk",Inter,sans-serif; font-weight:700; letter-spacing:-.02em;
  font-size:16px; margin-right:2px; white-space:nowrap;
}
.brand .mark{
  width:20px;height:20px;border-radius:6px;align-self:center;
  background:linear-gradient(145deg,var(--signal),var(--ink-3));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
}
.chip{
  display:inline-flex; align-items:center; gap:7px;
  height:30px; padding:0 11px; border-radius:999px;
  border:1px solid var(--panel-edge); background:transparent;
  font-size:12.5px; color:var(--text-dim); white-space:nowrap;
}
.chip b{ color:var(--text); font-family:"Space Grotesk",monospace; font-weight:600; letter-spacing:.01em; }
.chip.live{ color:var(--signal-ink); border-color:color-mix(in srgb, var(--signal) 40%, transparent); background:var(--sel); }
.chip.solo{ color:var(--warn); border-color:color-mix(in srgb, var(--warn) 35%, transparent); }
.chip.down{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 35%, transparent); }
.dot{ width:7px;height:7px;border-radius:50%; background:currentColor; flex:none; }
.chip.live .dot{ animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1; box-shadow:0 0 0 0 color-mix(in srgb,var(--signal) 60%,transparent);} 50%{opacity:.75; box-shadow:0 0 0 5px transparent;} }

.spacer{ flex:1 1 auto; }

/* presence */
#roster{ display:flex; align-items:center; padding-left:6px; }
.avatar{
  width:30px;height:30px;border-radius:50%; margin-left:-8px;
  display:grid; place-items:center; flex:none;
  font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:11.5px; color:#fff;
  border:2px solid var(--panel-solid);
  box-shadow:0 1px 3px rgba(13,22,38,.3);
  transition:transform .18s cubic-bezier(.2,.8,.2,1);
  cursor:default;
}
.avatar:hover{ transform:translateY(-3px); z-index:2; }
.avatar.me{ box-shadow:0 0 0 2px var(--signal), 0 1px 3px rgba(13,22,38,.3); }
.avatar[data-ghost="1"]{ opacity:.45; }

.icon-btn{
  width:34px;height:34px; display:grid; place-items:center; flex:none;
  border-radius:10px; border:1px solid transparent; background:transparent;
  color:var(--text-dim); cursor:pointer;
  transition:background .14s ease,color .14s ease;
}
.icon-btn:hover{ background:var(--sel); color:var(--text); }
.icon-btn svg{ width:18px;height:18px; }

/* --- tool tray (the one loud thing) --- */
#tray{
  position:absolute; left:var(--tray-gap); top:50%; transform:translateY(-50%);
  z-index:40; padding:8px; display:flex; flex-direction:column; gap:4px;
}
.tool{
  position:relative; width:44px;height:44px; border-radius:12px;
  border:1px solid transparent; background:transparent; cursor:pointer;
  display:grid; place-items:center; color:var(--text-dim);
  transition:background .15s ease, color .15s ease, transform .15s cubic-bezier(.2,.8,.2,1);
}
.tool svg{ width:21px;height:21px; }
.tool:hover{ color:var(--text); background:var(--sel); }
.tool[aria-pressed="true"]{
  color:var(--paper); background:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
}
.tool[aria-pressed="true"]{ color:#fff; background:linear-gradient(160deg,var(--ink-3),var(--ink)); }
.tool .key{
  position:absolute; right:4px; bottom:2px; font-size:9px; font-weight:600;
  font-family:"Space Grotesk",monospace; opacity:.45;
}
.tray-rule{ height:1px; background:var(--panel-edge); margin:5px 6px; }

/* tooltips */
[data-tip]{ position:relative; }
[data-tip]::after{
  content:attr(data-tip);
  position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%) scale(.96);
  background:var(--ink); color:#fff; font-size:12px; white-space:nowrap;
  padding:5px 9px; border-radius:7px; pointer-events:none; opacity:0;
  transition:opacity .12s ease, transform .12s ease; z-index:60;
}
[data-tip]:hover::after{ opacity:1; transform:translateY(-50%) scale(1); }
#topbar [data-tip]::after,
#dock [data-tip]::after{ left:50%; top:auto; bottom:calc(100% + 10px); transform:translate(-50%,0) scale(.96); }
#topbar [data-tip]:hover::after,
#dock [data-tip]:hover::after{ transform:translate(-50%,-2px) scale(1); }
#topbar [data-tip]::after{ top:calc(100% + 10px); bottom:auto; }

/* --- ink dock (colors + width) --- */
#dock{
  position:absolute; left:50%; transform:translateX(-50%);
  bottom:calc(var(--tray-gap) + env(safe-area-inset-bottom,0px));
  z-index:40; padding:9px 12px; display:flex; align-items:center; gap:12px;
}
.swatches{ display:flex; gap:6px; }
.swatch{
  width:24px;height:24px;border-radius:50%; cursor:pointer; padding:0;
  border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(13,22,38,.18);
  transition:transform .15s cubic-bezier(.2,.8,.2,1);
}
.swatch:hover{ transform:scale(1.15); }
.swatch[aria-pressed="true"]{ border-color:var(--text); transform:scale(1.15); }
.dock-rule{ width:1px; align-self:stretch; background:var(--panel-edge); }
.width-group{ display:flex; align-items:center; gap:9px; }
#size{
  -webkit-appearance:none; appearance:none; width:104px; height:20px; background:transparent; cursor:pointer;
}
#size::-webkit-slider-runnable-track{ height:4px; border-radius:2px; background:var(--panel-edge); }
#size::-moz-range-track{ height:4px; border-radius:2px; background:var(--panel-edge); }
#size::-webkit-slider-thumb{
  -webkit-appearance:none; width:16px;height:16px;border-radius:50%; margin-top:-6px;
  background:var(--panel-solid); border:2px solid var(--text); box-shadow:0 1px 3px rgba(13,22,38,.3);
}
#size::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--panel-solid); border:2px solid var(--text);
}
#size-readout{
  font-family:"Space Grotesk",monospace; font-weight:600; font-size:12px;
  color:var(--text-dim); width:30px; text-align:right; font-variant-numeric:tabular-nums;
}
#nib-preview{ width:26px;height:26px; display:grid; place-items:center; flex:none; }
#nib{ border-radius:50%; background:var(--pen,#0d1626); transition:width .1s ease,height .1s ease; }
.custom-color{
  width:26px;height:26px;padding:0;border:1px solid var(--panel-edge);
  border-radius:8px; background:transparent; cursor:pointer;
}
.custom-color::-webkit-color-swatch-wrapper{ padding:3px; }
.custom-color::-webkit-color-swatch{ border:none; border-radius:5px; }

/* --- utility dock bottom-right --- */
#utils{
  position:absolute; right:var(--tray-gap);
  bottom:calc(var(--tray-gap) + env(safe-area-inset-bottom,0px));
  z-index:40; padding:7px; display:flex; gap:3px; align-items:center;
}

/* --- remote cursors --- */
.cursor{
  position:absolute; top:0; left:0; will-change:transform;
  transition:transform .09s linear, opacity .4s ease;
  display:flex; align-items:flex-start; gap:2px;
}
.cursor.idle{ opacity:0; }
.cursor svg{ width:20px;height:20px; flex:none; filter:drop-shadow(0 1px 2px rgba(13,22,38,.35)); }
.cursor .tag{
  margin-top:11px; font-size:11.5px; font-weight:600; color:#fff;
  padding:2px 7px; border-radius:999px; white-space:nowrap;
  box-shadow:0 2px 6px rgba(13,22,38,.28);
}

/* --- toasts --- */
#toasts{
  position:absolute; top:calc(var(--tray-gap) + 62px); left:50%; transform:translateX(-50%);
  z-index:70; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;
}
.toast{
  background:var(--ink); color:#fff; padding:8px 14px; border-radius:999px;
  font-size:13px; box-shadow:var(--shadow-lift);
  animation:drop .22s cubic-bezier(.2,.8,.2,1);
  display:flex; align-items:center; gap:8px;
}
.toast .dot{ background:var(--signal); }
@keyframes drop{ from{ opacity:0; transform:translateY(-8px); } }

/* --- empty state --- */
#hint{
  position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; z-index:5;
  transition:opacity .4s ease;
}
#hint .card{ text-align:center; color:var(--text-dim); max-width:320px; padding:0 20px; }
#hint h1{
  font-family:"Space Grotesk",sans-serif; font-size:19px; font-weight:600;
  color:var(--text); margin:0 0 6px; letter-spacing:-.01em;
}
#hint p{ margin:0; font-size:13.5px; }
#hint kbd{
  font-family:"Space Grotesk",monospace; font-size:11.5px; font-weight:600;
  border:1px solid var(--panel-edge); border-bottom-width:2px; border-radius:5px;
  padding:1px 5px; color:var(--text);
}
.hidden{ opacity:0 !important; }

/* --- name modal --- */
#name-modal{
  position:fixed; inset:0; z-index:100;
  display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--ink) 45%, transparent);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  transition:opacity .25s ease, visibility .25s ease;
}
#name-modal[aria-hidden="true"]{ opacity:0; visibility:hidden; pointer-events:none; }
#name-form{
  width:min(360px, calc(100vw - 40px));
  padding:26px 24px 22px; border-radius:var(--r-lg);
  display:flex; flex-direction:column; gap:14px;
  box-shadow:var(--shadow-lift);
}
#name-form h2{
  margin:0; font-family:"Space Grotesk",sans-serif; font-size:19px; font-weight:600;
  letter-spacing:-.01em; color:var(--text);
}
#name-form p{ margin:-8px 0 0; font-size:13px; color:var(--text-dim); }
#name-input{
  width:100%; height:44px; padding:0 14px; border-radius:10px;
  border:1px solid var(--panel-edge); background:var(--paper); color:var(--text);
  font-size:15px;
}
#name-input:focus-visible{ outline:2px solid var(--signal); outline-offset:1px; }
.name-swatches{ display:flex; flex-wrap:wrap; gap:7px; }
.name-swatches .swatch{ width:26px; height:26px; }
#name-submit{
  height:42px; border-radius:10px; border:none; cursor:pointer;
  background:var(--ink); color:var(--paper); font-weight:600; font-size:14px;
  transition:transform .12s cubic-bezier(.2,.8,.2,1), opacity .12s ease;
}
#name-submit:hover{ opacity:.92; }
#name-submit:active{ transform:scale(.98); }

/* --- inline text editor --- */
.text-editor{
  position:absolute; z-index:45; min-width:140px; max-width:340px;
  padding:3px 5px; margin:0; border:1.5px dashed var(--signal); border-radius:6px;
  background:color-mix(in srgb, var(--paper) 55%, transparent);
  font-family:Inter,sans-serif; line-height:1.32; resize:none; overflow:hidden;
  outline:none;
}

/* --- image upload progress toast (reuses .toast look via inline style) --- */

/* --- responsive --- */
@media (max-width: 860px){
  .brand span{ display:none; }
  #chip-room{ display:none; }
  #tray{ flex-direction:row; left:50%; top:auto; transform:translateX(-50%);
         bottom:calc(var(--tray-gap) + 68px + env(safe-area-inset-bottom,0px)); }
  .tray-rule{ width:1px; height:auto; margin:6px 4px; }
  .tool .key{ display:none; }
  [data-tip]::after{ display:none; }
  #dock{ left:var(--tray-gap); right:var(--tray-gap); transform:none; justify-content:center;
         overflow-x:auto; border-radius:var(--r-md); }
  #utils{ bottom:auto; top:calc(var(--tray-gap) + 62px); }
  .width-group{ display:none; }
}
</style>
</head>
<body>

<div id="stage">
  <div id="paper"></div>
  <canvas id="board"></canvas>
  <canvas id="overlay"></canvas>
  <div id="cursor-layer"></div>

  <!-- ─────────── name modal (first run) ─────────── -->
  <div id="name-modal" aria-hidden="false">
    <form id="name-form" class="glass">
      <h2>What should we call you?</h2>
      <p>This is the name and colour other people in the room will see.</p>
      <input type="text" id="name-input" maxlength="24" autocomplete="off" placeholder="e.g. Priya" />
      <div class="name-swatches" id="name-swatches"></div>
      <button type="submit" id="name-submit">Start drawing</button>
    </form>
  </div>

  <div id="hint"><div class="card">
    <h1>Start drawing</h1>
    <p>Pick a tool on the left, or press <kbd>P</kbd> for the pen. Everyone in this room sees your strokes as you make them.</p>
  </div></div>

  <!-- ─────────── top bar ─────────── -->
  <header id="topbar" class="glass">
    <div class="brand"><span class="mark"></span><span>CollabBoard</span></div>
    <span class="chip" id="chip-room">Room <b id="room-name">board-101</b></span>
    <span class="chip" id="chip-status"><span class="dot"></span><span id="status-text">Connecting</span></span>
    <div class="spacer"></div>
    <div id="roster" aria-label="People in this room"></div>
    <button class="icon-btn" id="btn-theme" data-tip="Switch theme" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
    </button>
    <button class="icon-btn" id="btn-copy" data-tip="Copy room link" aria-label="Copy room link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5a3.5 3.5 0 0 0 5 0l3-3a3.54 3.54 0 0 0-5-5l-1.2 1.2"/><path d="M14 10.5a3.5 3.5 0 0 0-5 0l-3 3a3.54 3.54 0 0 0 5 5l1.2-1.2"/></svg>
    </button>
  </header>

  <!-- ─────────── tool tray ─────────── -->
  <nav id="tray" class="glass" aria-label="Tools">
    <button class="tool" data-tool="pen" data-tip="Pen" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5 8 18.6 19.1 7.5a2.3 2.3 0 0 0-3.2-3.2L4.8 15.4Z"/><path d="M14.6 5.7 17.8 8.9"/></svg>
      <span class="key">P</span>
    </button>
    <button class="tool" data-tool="marker" data-tip="Highlighter" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 15.5 5 19h5l1.8-1.8"/><path d="m10 16.6-2.6-2.6 7-7a1.8 1.8 0 0 1 2.6 0l1.5 1.5a1.8 1.8 0 0 1 0 2.6Z"/></svg>
      <span class="key">H</span>
    </button>
    <button class="tool" data-tool="eraser" data-tip="Eraser" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 4.5 5 5a1.6 1.6 0 0 1 0 2.3l-7 7H8l-3.5-3.5a1.6 1.6 0 0 1 0-2.3l7.7-8.5a1.6 1.6 0 0 1 2.3 0Z"/><path d="M9 9.5 15.5 16"/></svg>
      <span class="key">E</span>
    </button>
    <div class="tray-rule"></div>
    <button class="tool" data-tool="line" data-tip="Line" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 19 19 5"/></svg>
      <span class="key">L</span>
    </button>
    <button class="tool" data-tool="arrow" data-tip="Arrow" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5"/><path d="M11 5h8v8"/></svg>
      <span class="key">A</span>
    </button>
    <button class="tool" data-tool="rect" data-tip="Rectangle" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="13" rx="2.2"/></svg>
      <span class="key">R</span>
    </button>
    <button class="tool" data-tool="ellipse" data-tip="Ellipse" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="12" rx="8.5" ry="6.8"/></svg>
      <span class="key">O</span>
    </button>
    <div class="tray-rule"></div>
    <button class="tool" data-tool="text" data-tip="Text" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 6.5h13"/><path d="M12 6.5v11"/><path d="M9 17.5h6"/></svg>
      <span class="key">T</span>
    </button>
  </nav>

  <!-- ─────────── ink dock ─────────── -->
  <div id="dock" class="glass">
    <div id="nib-preview"><span id="nib"></span></div>
    <div class="swatches" id="swatches"></div>
    <input type="color" id="custom-color" class="custom-color" value="#0d1626" aria-label="Custom colour" data-tip="Custom colour">
    <div class="dock-rule"></div>
    <div class="width-group">
      <input type="range" id="size" min="1" max="36" value="4" aria-label="Stroke width">
      <span id="size-readout">4</span>
    </div>
  </div>

  <!-- ─────────── utilities ─────────── -->
  <div id="utils" class="glass">
    <button class="icon-btn" id="btn-undo" data-tip="Undo" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h11a4.5 4.5 0 0 1 0 9h-4"/><path d="m8 5-4 4 4 4"/></svg>
    </button>
    <button class="icon-btn" id="btn-redo" data-tip="Redo" aria-label="Redo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 9H9a4.5 4.5 0 0 0 0 9h4"/><path d="m16 5 4 4-4 4"/></svg>
    </button>
    <button class="icon-btn" id="btn-paper" data-tip="Paper: dots" aria-label="Change paper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2.4"/><path d="M9 4v16M15 4v16M4 9h16M4 15h16" opacity=".55"/></svg>
    </button>
    <button class="icon-btn" id="btn-image" data-tip="Add image" aria-label="Add image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4.5 17 4.8-5.2a1.4 1.4 0 0 1 2 0L15 15.5"/><path d="m12.5 14 2-2.1a1.4 1.4 0 0 1 2 0l3 3.2"/></svg>
    </button>
    <input type="file" id="file-image" accept="image/*" hidden>
    <button class="icon-btn" id="btn-save" data-tip="Save as PNG" aria-label="Save as PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="m8 10.5 4 4 4-4"/><path d="M4.5 16.5v1.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-1.5"/></svg>
    </button>
    <button class="icon-btn" id="btn-clear" data-tip="Clear board" aria-label="Clear board">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15"/><path d="M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/><path d="M6.5 7.5 7.4 19a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5L17.5 7.5"/></svg>
    </button>
  </div>

  <div id="toasts" aria-live="polite"></div>
</div>

<script>
(() => {
"use strict";

/* ════════════════════════════════════════════════════════════
   1. Identity & room
   ════════════════════════════════════════════════════════════ */
const PRESENCE = ["#ef4444","#f59e0b","#10b981","#06b6d4","#3b82f6","#8b5cf6","#ec4899","#84cc16","#f97316","#14b8a6"];
const HANDLES  = ["Ash","Bea","Cy","Dev","Eli","Fox","Gus","Hal","Ira","Jo","Kit","Lou","Max","Nia","Oz","Pip","Quin","Rae","Sol","Tam"];

const roomName = (location.pathname.match(/\/board\/([\w-]+)/) || [])[1]
              || new URLSearchParams(location.search).get("room")
              || "board-101";
const me = {
  id: "u_" + Math.random().toString(36).slice(2, 9),
  name: HANDLES[Math.floor(Math.random() * HANDLES.length)] + " " + Math.floor(Math.random() * 90 + 10),
  color: PRESENCE[Math.floor(Math.random() * PRESENCE.length)]
};
document.getElementById("room-name").textContent = roomName;

/* ════════════════════════════════════════════════════════════
   2. Canvas plumbing — DPR-aware, resize-safe
   ════════════════════════════════════════════════════════════ */
const board   = document.getElementById("board");
const overlay = document.getElementById("overlay");
const bctx = board.getContext("2d");
const octx = overlay.getContext("2d");
const stage = document.getElementById("stage");

let W = 0, H = 0, DPR = 1;

function fit() {
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  for (const c of [board, overlay]) {
    c.width  = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
  }
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  repaint();            // rebuild from history — nothing is lost
}
addEventListener("resize", () => { clearTimeout(fit._t); fit._t = setTimeout(fit, 80); });

/* Points are stored normalised (0–1) so a 4K monitor and a phone
   see the same drawing in the same place. */
const toN = (x, y) => ({ x: x / W, y: y / H });
const px  = n => n.x * W;
const py  = n => n.y * H;

/* ════════════════════════════════════════════════════════════
   3. Model
   ════════════════════════════════════════════════════════════ */
const strokes = [];               // committed, in paint order
const live    = new Map();        // strokeId -> stroke being drawn right now
const undone  = [];               // my redo stack
const FREEHAND = new Set(["pen", "marker", "eraser"]);

const styleFor = (ctx, s) => {
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.globalCompositeOperation = s.tool === "eraser" ? "destination-out" : "source-over";
  ctx.globalAlpha   = s.tool === "marker" ? 0.32 : 1;
  ctx.strokeStyle   = s.tool === "eraser" ? "#000" : s.color;
  ctx.fillStyle     = s.color;
  ctx.lineWidth     = s.tool === "marker" ? s.size * 3.2
                    : s.tool === "eraser" ? s.size * 2.6
                    : s.size;
};
const reset = ctx => { ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; };

function paintFree(ctx, s) {
  const p = s.pts; if (!p.length) return;
  styleFor(ctx, s);
  ctx.beginPath();
  if (p.length === 1) {
    ctx.arc(px(p[0]), py(p[0]), ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fill(); reset(ctx); return;
  }
  ctx.moveTo(px(p[0]), py(p[0]));
  for (let i = 1; i < p.length - 1; i++) {
    const mx = (px(p[i]) + px(p[i + 1])) / 2, my = (py(p[i]) + py(p[i + 1])) / 2;
    ctx.quadraticCurveTo(px(p[i]), py(p[i]), mx, my);   // smoothing
  }
  ctx.lineTo(px(p[p.length - 1]), py(p[p.length - 1]));
  ctx.stroke(); reset(ctx);
}

function paintShape(ctx, s) {
  const a = s.pts[0], b = s.pts[1]; if (!a || !b) return;
  const x0 = px(a), y0 = py(a), x1 = px(b), y1 = py(b);
  styleFor(ctx, s);
  ctx.beginPath();
  if (s.tool === "rect") {
    const r = Math.min(6, Math.abs(x1 - x0) / 4, Math.abs(y1 - y0) / 4);
    ctx.roundRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0), r);
    ctx.stroke();
  } else if (s.tool === "ellipse") {
    ctx.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.abs(x1 - x0) / 2, Math.abs(y1 - y0) / 2, 0, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    if (s.tool === "arrow") {
      const ang = Math.atan2(y1 - y0, x1 - x0);
      const head = Math.max(11, s.size * 3.4);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - head * Math.cos(ang - 0.42), y1 - head * Math.sin(ang - 0.42));
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - head * Math.cos(ang + 0.42), y1 - head * Math.sin(ang + 0.42));
      ctx.stroke();
    }
  }
  reset(ctx);
}

/* --- text --- */
function wrapLines(ctx, text, maxWidth) {
  const out = [];
  for (const para of text.split("\n")) {
    if (para === "") { out.push(""); continue; }
    let line = "";
    for (const word of para.split(" ")) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) { out.push(line); line = word; }
      else line = test;
    }
    out.push(line);
  }
  return out;
}
function paintText(ctx, s) {
  const p = s.pts[0]; if (!p || !s.content) return;
  const fontPx = 13 + s.size * 2.6;
  const maxWidth = s.maxWidth || 260;
  ctx.save();
  ctx.font = `600 ${fontPx}px Inter, sans-serif`;
  ctx.fillStyle = s.color; ctx.textBaseline = "top";
  const lines = wrapLines(ctx, s.content, maxWidth);
  const lineH = fontPx * 1.32;
  lines.forEach((line, i) => ctx.fillText(line, px(p), py(p) + i * lineH));
  ctx.restore();
}

/* --- images --- */
const imageCache = new Map();
function ensureImage(s) {
  let img = imageCache.get(s.id);
  if (!img) {
    img = new Image();
    img.onload = () => repaint();
    img.src = s.content;
    imageCache.set(s.id, img);
  }
  return img;
}
function paintImage(ctx, s) {
  const img = ensureImage(s);
  if (!img.complete || !img.naturalWidth) return;      // repaints again once loaded
  const p = s.pts[0];
  const w = s.wFrac * W, h = s.hFrac * H;
  ctx.drawImage(img, px(p), py(p), w, h);
  ctx.save();
  ctx.strokeStyle = "rgba(13,22,38,.14)"; ctx.lineWidth = 1;
  ctx.strokeRect(px(p) + 0.5, py(p) + 0.5, w, h);
  ctx.restore();
}

const paint = (ctx, s) =>
  s.tool === "text"  ? paintText(ctx, s)  :
  s.tool === "image" ? paintImage(ctx, s) :
  FREEHAND.has(s.tool) ? paintFree(ctx, s) : paintShape(ctx, s);

function repaint() {
  bctx.clearRect(0, 0, W, H);
  for (const s of strokes) paint(bctx, s);
  renderLive();
  document.getElementById("hint").classList.toggle("hidden", strokes.length > 0 || live.size > 0);
}
function renderLive() {
  octx.clearRect(0, 0, W, H);
  for (const s of live.values()) if (s.tool !== "eraser") paint(octx, s);
}
/* Eraser is applied straight to the board as it moves, so it reveals
   the paper underneath instead of painting white over it. */
function eraseSegment(s) {
  const p = s.pts; if (p.length < 2) return;
  const a = p[p.length - 2], b = p[p.length - 1];
  styleFor(bctx, s);
  bctx.beginPath(); bctx.moveTo(px(a), py(a)); bctx.lineTo(px(b), py(b)); bctx.stroke();
  reset(bctx);
}

function commit(s) {
  live.delete(s.id);
  if (FREEHAND.has(s.tool) && s.pts.length < 1) return;
  strokes.push(s);
  if (s.tool === "eraser") { renderLive(); }
  else { paint(bctx, s); renderLive(); }
  document.getElementById("hint").classList.add("hidden");
}

/* ════════════════════════════════════════════════════════════
   4. Tool state
   ════════════════════════════════════════════════════════════ */
const ui = { tool: "pen", color: "#0d1626", size: 4 };
const nib = document.getElementById("nib");

function refreshNib() {
  const d = Math.max(4, Math.min(22, ui.tool === "marker" ? ui.size * 2 : ui.size));
  nib.style.width = nib.style.height = d + "px";
  nib.style.background = ui.tool === "eraser" ? "var(--panel-edge)" : ui.color;
  nib.style.opacity = ui.tool === "marker" ? .45 : 1;
}

const SWATCHES = ["#0d1626","#64748b","#dc2626","#ea580c","#ca8a04","#16a34a","#0891b2","#2563eb","#7c3aed","#db2777"];
const swatchBox = document.getElementById("swatches");
SWATCHES.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "swatch"; b.style.background = c;
  b.setAttribute("aria-pressed", i === 0); b.setAttribute("aria-label", "Colour " + c);
  b.onclick = () => setColor(c);
  swatchBox.appendChild(b);
});
function setColor(c) {
  ui.color = c;
  [...swatchBox.children].forEach(b => b.setAttribute("aria-pressed", b.style.background === hexToRgbStr(c)));
  document.getElementById("custom-color").value = /^#[0-9a-f]{6}$/i.test(c) ? c : "#000000";
  refreshNib();
}
const hexToRgbStr = h => {
  const n = parseInt(h.slice(1), 16);
  return `rgb(${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255})`;
};
document.getElementById("custom-color").oninput = e => setColor(e.target.value);

const tools = [...document.querySelectorAll(".tool")];
function setTool(t) {
  ui.tool = t;
  tools.forEach(b => b.setAttribute("aria-pressed", b.dataset.tool === t));
  stage.style.cursor = t === "eraser" ? "cell" : "crosshair";
  refreshNib();
}
tools.forEach(b => b.onclick = () => setTool(b.dataset.tool));

const sizeInput = document.getElementById("size"), sizeOut = document.getElementById("size-readout");
sizeInput.oninput = () => { ui.size = +sizeInput.value; sizeOut.textContent = ui.size; refreshNib(); };

/* dark mode should start with light ink */
const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
if (prefersDark) { SWATCHES[0] = "#e8eef7"; swatchBox.children[0].style.background = "#e8eef7"; setColor("#e8eef7"); }
refreshNib();

/* ════════════════════════════════════════════════════════════
   5. Pointer input
   ════════════════════════════════════════════════════════════ */
let drawing = null;
const local = e => {
  const r = stage.getBoundingClientRect();
  return toN(e.clientX - r.left, e.clientY - r.top);
};

overlay.style.pointerEvents = "none";

/* --- text tool: click to open an inline editor, commit on blur --- */
let activeEditor = null;
function commitActiveEditor() {
  if (!activeEditor) return;
  const { el, anchor } = activeEditor;
  activeEditor = null;
  const text = el.value.trim();
  const maxWidth = el.offsetWidth;
  el.remove();
  if (!text) return;
  const s = {
    id: me.id + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    userId: me.id, tool: "text", color: ui.color, size: ui.size,
    pts: [anchor], content: text, maxWidth
  };
  commit(s);
  send({ t: "redraw", s: slim(s) });
}
function openTextEditor(n) {
  commitActiveEditor();
  const el = document.createElement("textarea");
  el.className = "text-editor"; el.rows = 1;
  el.style.left = px(n) + "px"; el.style.top = py(n) + "px";
  el.style.color = ui.color; el.style.fontSize = (13 + ui.size * 2.6) + "px";
  el.style.fontWeight = "600";
  stage.appendChild(el);
  activeEditor = { el, anchor: n };
  el.focus();
  el.addEventListener("input", () => { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; });
  el.addEventListener("keydown", ev => {
    ev.stopPropagation();
    if (ev.key === "Escape") { activeEditor = null; el.remove(); }
    else if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); commitActiveEditor(); }
  });
  el.addEventListener("blur", commitActiveEditor);
}

board.addEventListener("pointerdown", e => {
  if (e.button !== 0 && e.pointerType === "mouse") return;
  if (activeEditor) { commitActiveEditor(); return; }
  const n0 = local(e);
  if (ui.tool === "text") { e.preventDefault(); openTextEditor(n0); return; }
  board.setPointerCapture(e.pointerId);
  const n = local(e);
  drawing = {
    id: me.id + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    userId: me.id, tool: ui.tool, color: ui.color, size: ui.size,
    pts: FREEHAND.has(ui.tool) ? [n] : [n, n]
  };
  live.set(drawing.id, drawing);
  undone.length = 0;
  send({ t: "begin", s: slim(drawing) });
  if (drawing.tool !== "eraser") renderLive();
});

board.addEventListener("pointermove", e => {
  const n = local(e);
  sendCursor(n);
  if (!drawing) return;
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if (FREEHAND.has(drawing.tool)) {
    const added = [];
    for (const ev of events) {
      const q = local(ev);
      const last = drawing.pts[drawing.pts.length - 1];
      if (Math.hypot(q.x - last.x, q.y - last.y) * W < 1.1) continue;
      drawing.pts.push(q); added.push(q);
      if (drawing.tool === "eraser") eraseSegment(drawing);
    }
    if (!added.length) return;
    if (drawing.tool !== "eraser") renderLive();
    send({ t: "pts", id: drawing.id, p: added.map(pack) });
  } else {
    drawing.pts[1] = n;
    renderLive();
    send({ t: "pts", id: drawing.id, p: [pack(n)], replace: 1 });
  }
});

function endStroke() {
  if (!drawing) return;
  const s = drawing; drawing = null;
  commit(s);
  send({ t: "end", id: s.id });
}
board.addEventListener("pointerup", endStroke);
board.addEventListener("pointercancel", endStroke);
board.addEventListener("pointerleave", e => { if (drawing && e.pointerType !== "mouse") endStroke(); });
addEventListener("blur", endStroke);

const pack  = n => [+n.x.toFixed(4), +n.y.toFixed(4)];
const unpack = a => ({ x: a[0], y: a[1] });
function slim(s) {
  const base = { id: s.id, userId: s.userId, tool: s.tool, color: s.color, size: s.size, pts: s.pts.map(pack) };
  if (s.tool === "text")  { base.content = s.content; base.maxWidth = s.maxWidth; }
  if (s.tool === "image") { base.content = s.content; base.wFrac = s.wFrac; base.hFrac = s.hFrac; }
  return base;
}
const fat  = s => ({ ...s, pts: s.pts.map(unpack) });

/* ════════════════════════════════════════════════════════════
   6. History
   ════════════════════════════════════════════════════════════ */
function undo() {
  for (let i = strokes.length - 1; i >= 0; i--) {
    if (strokes[i].userId === me.id) {
      undone.push(strokes.splice(i, 1)[0]);
      repaint(); send({ t: "undo", id: undone[undone.length - 1].id });
      return;
    }
  }
  toast("Nothing of yours left to undo");
}
function redo() {
  const s = undone.pop();
  if (!s) return toast("Nothing to redo");
  strokes.push(s); repaint(); send({ t: "redraw", s: slim(s) });
}
function clearAll(broadcast = true) {
  strokes.length = 0; live.clear(); undone.length = 0; repaint();
  if (broadcast) { send({ t: "clear" }); toast("Board cleared for everyone"); }
}
document.getElementById("btn-undo").onclick = undo;
document.getElementById("btn-redo").onclick = redo;
document.getElementById("btn-clear").onclick = () => {
  if (!strokes.length) return toast("The board is already empty");
  clearAll(true);
};

/* ════════════════════════════════════════════════════════════
   7. Networking — Django Channels
   ════════════════════════════════════════════════════════════ */
const chip = document.getElementById("chip-status");
const statusText = document.getElementById("status-text");
let socket = null, retries = 0, everOpen = false;

function setStatus(kind, label) {
  chip.className = "chip " + kind;
  statusText.textContent = label;
}

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  let ws;
  try { ws = new WebSocket(`${scheme}://${location.host}/ws/canvas/${roomName}/`); }
  catch { return solo(); }
  socket = ws;

  ws.onopen = () => {
    everOpen = true; retries = 0;
    setStatus("live", "Live");
    send({ t: "hello", user: me });
    send({ t: "sync?" });
  };
  ws.onmessage = ev => { try { receive(JSON.parse(ev.data)); } catch {} };
  ws.onclose = () => {
    socket = null;
    if (!everOpen && retries === 0) return solo();
    setStatus("down", "Reconnecting");
    retries++;
    setTimeout(connect, Math.min(1000 * 2 ** retries, 15000));
  };
  ws.onerror = () => ws.close();
}
function solo() {
  setStatus("solo", "Solo");
  chip.setAttribute("data-tip", "No sync server reachable — drawing stays on this device");
}

const open = () => socket && socket.readyState === WebSocket.OPEN;
function send(msg) {
  if (!open()) return;
  msg.from = me.id; msg.room = roomName;
  socket.send(JSON.stringify(msg));
}

/* cursor updates, throttled to ~30/s */
let curT = 0;
function sendCursor(n) {
  const now = performance.now();
  if (now - curT < 33) return;
  curT = now;
  send({ t: "cursor", user: me, p: pack(n) });
}

function receive(m) {
  if (!m || m.from === me.id) return;
  switch (m.t) {
    case "hello":
      seen(m.user, true);
      send({ t: "hi", user: me });                 // answer so they see us too
      if (isSyncHost()) send({ t: "sync!", to: m.from, strokes: strokes.map(slim) });
      break;
    case "hi":     seen(m.user); break;
    case "cursor": seen(m.user); moveCursor(m.user, unpack(m.p)); break;
    case "begin":  live.set(m.s.id, fat(m.s)); renderLive(); break;
    case "pts": {
      const s = live.get(m.id); if (!s) return;
      if (m.replace) s.pts[1] = unpack(m.p[0]);
      else for (const p of m.p) { s.pts.push(unpack(p)); if (s.tool === "eraser") eraseSegment(s); }
      if (s.tool !== "eraser") renderLive();
      break;
    }
    case "end": { const s = live.get(m.id); if (s) commit(s); break; }
    case "undo": {
      const i = strokes.findIndex(s => s.id === m.id);
      if (i > -1) { strokes.splice(i, 1); repaint(); }
      break;
    }
    case "redraw": commit(fat(m.s)); break;
    case "clear":  clearAll(false); toast(nameOf(m.from) + " cleared the board"); break;
    case "sync?":  if (isSyncHost()) send({ t: "sync!", to: m.from, strokes: strokes.map(slim) }); break;
    case "sync!":
      if (m.to !== me.id || strokes.length) return;
      m.strokes.forEach(s => strokes.push(fat(s)));
      repaint();
      break;
    case "bye": drop(m.from); break;
  }
}
/* the longest-standing peer answers sync requests, so a new joiner
   gets exactly one copy of the board */
const isSyncHost = () => [...people.keys()].concat(me.id).sort()[0] === me.id;
addEventListener("pagehide", () => send({ t: "bye" }));

/* ════════════════════════════════════════════════════════════
   8. Presence
   ════════════════════════════════════════════════════════════ */
const people = new Map();          // id -> {name,color,last}
const roster = document.getElementById("roster");
const nameOf = id => people.get(id)?.name || "Someone";

function seen(u, announce) {
  if (!u || u.id === me.id) return;
  const fresh = !people.has(u.id);
  people.set(u.id, { name: u.name, color: u.color, last: performance.now() });
  if (fresh) { drawRoster(); if (announce) toast(u.name + " joined"); }
}
function drop(id) {
  if (!people.delete(id)) return;
  document.getElementById("c_" + id)?.remove();
  drawRoster();
}
function initials(n) { return n.split(" ")[0].slice(0, 2); }
function drawRoster() {
  roster.innerHTML = "";
  const add = (u, isMe, ghost) => {
    const d = document.createElement("div");
    d.className = "avatar" + (isMe ? " me" : "");
    d.style.background = u.color;
    d.textContent = initials(u.name);
    d.setAttribute("data-tip", isMe ? u.name + " (you)" : u.name);
    if (ghost) d.dataset.ghost = "1";
    roster.appendChild(d);
  };
  add(me, true);
  const now = performance.now();
  [...people.values()].slice(0, 6).forEach(u => add(u, false, now - u.last > 20000));
}
drawRoster();
setInterval(() => {
  const now = performance.now();
  for (const [id, u] of people) if (now - u.last > 45000) drop(id);
  if (open()) send({ t: "hi", user: me });
}, 12000);

/* ── remote cursors ── */
const layer = document.getElementById("cursor-layer");
function moveCursor(u, n) {
  let el = document.getElementById("c_" + u.id);
  if (!el) {
    el = document.createElement("div");
    el.id = "c_" + u.id; el.className = "cursor";
    el.innerHTML =
      `<svg viewBox="0 0 24 24" fill="${u.color}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round">
         <path d="M5.5 3.2 19 11.4l-6.1 1.2-2.3 5.9Z"/></svg>
       <span class="tag" style="background:${u.color}"></span>`;
    el.querySelector(".tag").textContent = u.name;
    layer.appendChild(el);
  }
  el.classList.remove("idle");
  el.style.transform = `translate(${px(n)}px, ${py(n)}px)`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add("idle"), 3500);
}

/* ════════════════════════════════════════════════════════════
   9. Chrome: paper, theme, export, toasts, shortcuts
   ════════════════════════════════════════════════════════════ */
const paperEl = document.getElementById("paper");
const PAPERS = [["", "dots"], ["ruled", "grid"], ["plain", "blank"]];
let paperIx = 0;
document.getElementById("btn-paper").onclick = e => {
  paperIx = (paperIx + 1) % PAPERS.length;
  paperEl.className = PAPERS[paperIx][0];
  e.currentTarget.setAttribute("data-tip", "Paper: " + PAPERS[paperIx][1]);
};

document.getElementById("btn-theme").onclick = () => {
  const dark = (document.documentElement.dataset.theme || (prefersDark ? "dark" : "light")) === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  toast(dark ? "Light theme" : "Dark theme");
};

document.getElementById("btn-copy").onclick = async () => {
  const url = location.origin + location.pathname + "?room=" + encodeURIComponent(roomName);
  try { await navigator.clipboard.writeText(url); toast("Room link copied"); }
  catch { toast("Copy blocked — the link is " + url); }
};

document.getElementById("btn-image").onclick = () => document.getElementById("file-image").click();
document.getElementById("file-image").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";                              // allow picking the same file again later
  if (!file) return;
  if (!file.type.startsWith("image/")) { toast("That file isn't an image"); return; }

  const bitmap = await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });

  // Downscale before sending — keeps the WebSocket payload small enough
  // for every peer, since the raw file is broadcast to the whole room.
  const MAX_DIM = 900;
  const scale = Math.min(1, MAX_DIM / Math.max(bitmap.naturalWidth, bitmap.naturalHeight));
  const off = document.createElement("canvas");
  off.width = Math.round(bitmap.naturalWidth * scale);
  off.height = Math.round(bitmap.naturalHeight * scale);
  off.getContext("2d").drawImage(bitmap, 0, 0, off.width, off.height);
  const dataUrl = off.toDataURL("image/jpeg", 0.85);
  URL.revokeObjectURL(bitmap.src);

  if (dataUrl.length > 900_000) { toast("That image is large and may be slow to sync"); }

  // Place it centred in the current view, sized to a third of the canvas width.
  const wFrac = 0.34;
  const displayW = wFrac * W;
  const displayH = displayW * (off.height / off.width);
  const anchor = { x: 0.5 - (displayW / 2) / W, y: 0.5 - (displayH / 2) / H };

  const s = {
    id: me.id + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    userId: me.id, tool: "image", color: null, size: 0,
    pts: [anchor], content: dataUrl, wFrac, hFrac: displayH / H
  };
  commit(s);
  send({ t: "redraw", s: slim(s) });
  toast("Image added");
};

document.getElementById("btn-save").onclick = () => {
  const out = document.createElement("canvas");
  out.width = board.width; out.height = board.height;
  const c = out.getContext("2d");
  c.fillStyle = getComputedStyle(document.body).backgroundColor;
  c.fillRect(0, 0, out.width, out.height);
  c.drawImage(board, 0, 0);
  const a = document.createElement("a");
  a.download = roomName + ".png";
  a.href = out.toDataURL("image/png");
  a.click();
  toast("Saved " + roomName + ".png");
};

const toasts = document.getElementById("toasts");
function toast(text) {
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<span class="dot"></span><span></span>`;
  t.lastChild.textContent = text;
  toasts.appendChild(t);
  setTimeout(() => { t.style.opacity = 0; t.style.transition = "opacity .3s"; }, 2400);
  setTimeout(() => t.remove(), 2800);
}

const KEYS = { p:"pen", h:"marker", e:"eraser", l:"line", a:"arrow", r:"rect", o:"ellipse", t:"text" };
addEventListener("keydown", ev => {
  if (ev.target.matches("input,textarea")) return;
  const k = ev.key.toLowerCase();
  if ((ev.metaKey || ev.ctrlKey) && k === "z") { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if ((ev.metaKey || ev.ctrlKey) && k === "y") { ev.preventDefault(); redo(); return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (KEYS[k]) { setTool(KEYS[k]); return; }
  if (k === "[" || k === "]") {
    sizeInput.value = Math.max(1, Math.min(36, ui.size + (k === "]" ? 1 : -1)));
    sizeInput.dispatchEvent(new Event("input"));
  }
});

/* --- first-run name prompt: gate connect() behind a confirmed identity ---
   Placed last, deliberately: enterRoom()/connect() can fire synchronously
   for a returning visitor (see "if (savedName)" below), so everything
   connect() touches (roster, send, sendCursor, etc.) must already be
   declared by this point in the script, not further down. */
const nameModal = document.getElementById("name-modal");
const nameForm  = document.getElementById("name-form");
const nameInput = document.getElementById("name-input");
const nameSwatchBox = document.getElementById("name-swatches");
let chosenColor = me.color;

PRESENCE.forEach(c => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "swatch"; b.style.background = c;
  b.setAttribute("aria-pressed", c === chosenColor);
  b.setAttribute("aria-label", "Colour " + c);
  b.onclick = () => {
    chosenColor = c;
    [...nameSwatchBox.children].forEach(x => x.setAttribute("aria-pressed", x.style.background === hexToRgbStr(c)));
  };
  nameSwatchBox.appendChild(b);
});

function enterRoom() {
  nameModal.setAttribute("aria-hidden", "true");
  drawRoster();
  connect();
}

let savedName = null, savedColor = null;
try { savedName = localStorage.getItem("cb_name"); savedColor = localStorage.getItem("cb_color"); } catch {}

if (savedName) {
  me.name = savedName;
  if (savedColor) me.color = savedColor;
  enterRoom();
} else {
  nameInput.focus();
  nameForm.addEventListener("submit", e => {
    e.preventDefault();
    const typed = nameInput.value.trim();
    me.name = typed || (HANDLES[Math.floor(Math.random() * HANDLES.length)] + " " + Math.floor(Math.random() * 90 + 10));
    me.color = chosenColor;
    try { localStorage.setItem("cb_name", me.name); localStorage.setItem("cb_color", me.color); } catch {}
    enterRoom();
  });
}

/* go */
fit();
})();
</script>
